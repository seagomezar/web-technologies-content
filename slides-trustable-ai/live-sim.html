<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador Koru de Telemetría y Split-Brain</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;padding:0;width:100%;height:100%;background:#0c1017;color:#f1f5f9;font-family:'Google Sans',Arial,sans-serif;overflow:hidden}
    .sim{display:grid;grid-template-rows:48px 1fr;width:100%;height:100%}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;background:#131a26;border-bottom:1.5px solid #263248}
    .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
    .dot-live{width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}
    body[data-playback-state="paused"] .dot-live{background:#fbbc04;box-shadow:none}
    .controls{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
    .pill{margin:0;display:inline-flex;align-items:center;justify-content:center;min-inline-size:28px;min-block-size:28px;font:700 12px/1 'Roboto Mono',monospace;padding:6px 9px;border-radius:999px;border:1.5px solid #334155;background:#1e293b;color:#e2e8f0;cursor:pointer;transition:background-color .15s ease,border-color .15s ease,color .15s ease}
    .pill:hover{border-color:#60a5fa}
    .pill:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
    .pill:is(.active,[aria-pressed="true"]){background:#4285f4;border-color:#93c5fd;color:#fff}
    .pill.rain.on,body[data-surface-state="wet"] .pill.rain{background:#0284c7;border-color:#7dd3fc;color:#fff}
    .pill.phys.off,body[data-guardrail-state="disabled"] .pill.phys{background:#b91c1c;border-color:#fca5a5;color:#fff}
    body[data-guardrail-state="disabled"] #path-status{color:#fca5a5}
    .grid{display:grid;grid-template-columns:250px 1fr 370px;gap:12px;padding:12px;height:100%;min-height:0}
    .card{background:#131a26;border:1.5px solid #263248;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0;contain:layout style paint}
    .card-title{font:700 11px/1 'Roboto Mono',monospace;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between}
    .gauges{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center}
    .speed-box{text-align:center;background:#0c1017;border:1px solid #263248;border-radius:12px;padding:10px 6px}
    .speed-val{font:700 44px/1 'Roboto Mono',monospace;color:#f8fafc;font-variant-numeric:tabular-nums}
    .speed-unit{font:400 12px/1.2 'Roboto Mono',monospace;color:#94a3b8;margin-top:4px;font-variant-numeric:tabular-nums}
    .pedals{display:flex;gap:10px;justify-content:center}
    .pedal{display:flex;flex-direction:column;align-items:center;gap:4px;font:700 10px/1 'Roboto Mono',monospace;color:#94a3b8;font-variant-numeric:tabular-nums}
    .bar-wrap{width:20px;height:78px;background:#0c1017;border:1px solid #334155;border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
    .bar{width:100%;height:100%;transform-origin:bottom;transform:scaleY(var(--level,0))}
    @media(prefers-reduced-motion:no-preference){.bar{transition:transform .12s linear}}
    .bar.thr{background:#34a853}
    .bar.brk{background:#ea4335}
    .fcircle{display:flex;align-items:center;gap:12px;background:#0c1017;border:1px solid #263248;border-radius:12px;padding:8px 10px;margin-top:auto}
    .fc-svg{width:84px;height:84px;flex-shrink:0}
    .fc-stats{font:400 11.5px/1.45 'Roboto Mono',monospace;color:#cbd5e1;font-variant-numeric:tabular-nums}
    .track-wrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#0c1017;border:1px solid #263248;border-radius:12px;overflow:hidden;contain:layout style paint}
    .track-svg{width:100%;height:100%;max-height:310px}
    .corner-banner{font:700 12px/1.2 'Roboto Mono',monospace;padding:6px 10px;border-radius:8px;background:#1e293b;color:#fde68a;border:1px solid #475569;display:flex;justify-content:space-between}
    .feed{display:flex;flex-direction:column;gap:8px;overflow:hidden;flex:1}
    .msg{padding:9px 11px;border-radius:10px;border-left:4px solid #64748b;background:#0c1017;font-size:13px;line-height:1.32}
    .msg.hot{border-left-color:#ea4335;background:#1f1318}
    .msg.feedforward{border-left-color:#fbbc04;background:#1f1b11}
    .msg.cold{border-left-color:#4285f4;background:#111a2e}
    .msg-head{display:flex;justify-content:space-between;font:700 10.5px/1 'Roboto Mono',monospace;margin-bottom:4px;letter-spacing:.04em}
    .msg.hot .msg-head{color:#fca5a5}
    .msg.feedforward .msg-head{color:#fde047}
    .msg.cold .msg-head{color:#93c5fd}
  </style>
</head>
<body>
  <div class="sim">
    <header class="topbar">
      <div class="brand"><span class="dot-live" aria-hidden="true"></span><span id="sim-title">koru · Simulador Split-Brain (10Hz)</span></div>
      <div class="controls" role="group" id="sim-controls" aria-label="Controles del simulador">
        <button type="button" class="pill active" data-coach="superaj" aria-pressed="true">SA Super AJ</button>
        <button type="button" class="pill" data-coach="aj" aria-pressed="false">AJ</button>
        <button type="button" class="pill" data-coach="rachel" aria-pressed="false">RC Rachel</button>
        <button type="button" class="pill" data-coach="tony" aria-pressed="false">TY Tony</button>
        <button type="button" class="pill" data-coach="garmin" aria-pressed="false">GM Garmin</button>
        <button type="button" class="pill rain" id="btn-rain">☀️ Seco (1.0g)</button>
        <button type="button" class="pill phys" id="btn-phys">🧠 Física: ON</button>
        <button type="button" class="pill" id="btn-pause" aria-label="Pausar simulación" title="Pausar simulación">⏸</button>
      </div>
    </header>

    <div class="grid">
      <section class="card">
        <div class="card-title"><span id="lbl-gauges">Telemetría Derivada</span><span id="grip-tag">GRIP 100%</span></div>
        <div class="gauges">
          <div class="speed-box">
            <div class="speed-val" id="val-speed">118</div>
            <div class="speed-unit" id="unit-speed">MPH · 190 km/h</div>
          </div>
          <div class="pedals">
            <div class="pedal"><span>THR</span><div class="bar-wrap"><div class="bar thr" id="bar-thr" style="--level:0.75"></div></div><span id="val-thr">75%</span></div>
            <div class="pedal"><span>BRK</span><div class="bar-wrap"><div class="bar brk" id="bar-brk" style="--level:0"></div></div><span id="val-brk">0%</span></div>
          </div>
        </div>
        <div class="fcircle">
          <svg class="fc-svg" id="fc-svg" viewBox="-55 -55 110 110" role="img" aria-label="Círculo de fricción">
            <circle cx="0" cy="0" r="46" fill="none" stroke="#334155" stroke-width="2" id="fc-outer"/>
            <circle cx="0" cy="0" r="28" fill="none" stroke="#1e293b" stroke-dasharray="3 3"/>
            <line x1="-48" y1="0" x2="48" y2="0" stroke="#334155"/>
            <line x1="0" y1="-48" x2="0" y2="48" stroke="#334155"/>
            <circle cx="0" cy="0" r="6" fill="#4ade80" id="fc-dot"/>
          </svg>
          <div class="fc-stats">
            <div>G-Lat: <strong id="val-glat">0.12g</strong></div>
            <div>G-Long: <strong id="val-glong">+0.38g</strong></div>
            <div>Uso Grip: <strong id="val-usage">40%</strong></div>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-title"><span id="lbl-track">Circuito &amp; Geocercas (150m)</span><span>SSE /events · 10Hz</span></div>
        <div class="track-wrap">
          <svg class="track-svg" viewBox="0 0 460 280" role="img" aria-labelledby="lbl-track">
            <path id="track-path" d="M 75 215 L 75 80 Q 75 36 125 36 L 290 36 Q 355 36 375 88 L 395 150 Q 406 205 352 222 L 250 236 Q 205 242 190 190 L 178 145 Q 165 112 135 142 L 112 212 Q 95 245 75 215 Z" fill="none" stroke="#334155" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 75 215 L 75 80 Q 75 36 125 36 L 290 36 Q 355 36 375 88 L 395 150 Q 406 205 352 222 L 250 236 Q 205 242 190 190 L 178 145 Q 165 112 135 142 L 112 212 Q 95 245 75 215 Z" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="6 5" opacity="0.75"/>
            <g fill="#fbbc04" font-family="Roboto Mono, monospace" font-size="11" font-weight="700">
              <circle cx="84" cy="56" r="5"/><text x="95" y="60">T1 Entry</text>
              <circle cx="348" cy="56" r="5"/><text x="278" y="54">T2 Carousel</text>
              <circle cx="384" cy="196" r="5"/><text x="302" y="198">T5 Bypass</text>
              <circle cx="170" cy="130" r="5"/><text x="182" y="128">T9 Crest</text>
            </g>
            <circle id="car-ring" cx="75" cy="200" r="15" fill="rgba(74,222,128,0.22)" stroke="#4ade80" stroke-width="1.5"/>
            <circle id="car-dot" cx="75" cy="200" r="6.5" fill="#4ade80"/>
          </svg>
        </div>
        <div class="corner-banner"><span id="sector-name">📍 Recta Principal</span><span id="path-status">HOT &lt;50ms · COLD Gemini 3.8</span></div>
      </section>

      <section class="card">
        <div class="card-title"><span id="lbl-feed">Radio del Coach en Vivo</span><span id="active-persona">SUPER AJ</span></div>
        <div class="feed" id="feed"></div>
      </section>
    </div>
  </div>

  <script>
    (() => {
      const es = new URLSearchParams(location.search).get('lang') !== 'en';
      if (!es) {
        document.documentElement.lang = 'en';
        document.title = 'Koru Interactive Telemetry & Split-Brain Simulator';
        document.getElementById('sim-title').textContent = 'koru · Split-Brain Simulator (10Hz)';
        document.getElementById('sim-controls').setAttribute('aria-label', 'Simulator controls');
        document.getElementById('fc-svg').setAttribute('aria-label', 'Friction circle');
        document.getElementById('lbl-gauges').textContent = 'Derived Telemetry';
        document.getElementById('lbl-track').textContent = 'Track & Geofences (150m)';
        document.getElementById('lbl-feed').textContent = 'Live Coach Radio';
        document.getElementById('btn-rain').textContent = '☀️ Dry (1.0g)';
        document.getElementById('btn-phys').textContent = '🧠 Physics: ON';
      }

      const pathEl = document.getElementById('track-path');
      const totalLen = pathEl.getTotalLength();
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

      const COCKPIT_TRANSITIONS = Object.freeze({
        playback: Object.freeze({
          playing: Object.freeze({ TOGGLE_PLAYBACK: 'paused', PAUSE: 'paused', PLAY: 'playing', MOTION_REDUCE: 'paused', MOTION_ALLOW: 'playing' }),
          paused: Object.freeze({ TOGGLE_PLAYBACK: 'playing', PAUSE: 'paused', PLAY: 'playing', MOTION_REDUCE: 'paused', MOTION_ALLOW: 'playing' }),
        }),
        surface: Object.freeze({
          dry: Object.freeze({ TOGGLE_SURFACE: 'wet', SET_WET: 'wet', SET_DRY: 'dry' }),
          wet: Object.freeze({ TOGGLE_SURFACE: 'dry', SET_WET: 'wet', SET_DRY: 'dry' }),
        }),
        guardrails: Object.freeze({
          enabled: Object.freeze({ TOGGLE_GUARDRAILS: 'disabled', DISABLE_GUARDRAILS: 'disabled', ENABLE_GUARDRAILS: 'enabled' }),
          disabled: Object.freeze({ TOGGLE_GUARDRAILS: 'enabled', DISABLE_GUARDRAILS: 'disabled', ENABLE_GUARDRAILS: 'enabled' }),
        }),
        personas: Object.freeze(['superaj', 'aj', 'rachel', 'tony', 'garmin']),
        sectorPhases: Object.freeze([0, 1, 2, 3, 4]),
      });

      let simTimer = null;
      let userPlaybackIntent = 'auto';
      let cockpit = {
        playback: reduceMotion.matches ? 'paused' : 'playing',
        surface: 'dry',
        guardrails: 'enabled',
        persona: 'superaj',
        sectorPhase: 0,
        progress: 0,
      };

      const phases = [
        { range: [0.00, 0.16], nameEs: 'Recta Principal', nameEn: 'Main Straight', spd: 126, thr: 94, brk: 0, glat: 0.08, glong: 0.45, type: 'straight' },
        { range: [0.16, 0.30], nameEs: 'T1 Entry · Frenada Fuerte', nameEn: 'T1 Entry · Heavy Braking', spd: 78, thr: 0, brk: 84, glat: 0.65, glong: -1.05, type: 't1' },
        { range: [0.30, 0.52], nameEs: 'T2 Carousel · Apoyo Largo', nameEn: 'T2 Carousel · Long Load', spd: 68, thr: 28, brk: 18, glat: 1.28, glong: -0.18, type: 't2' },
        { range: [0.52, 0.74], nameEs: 'T5 Bypass · Subida Ciega', nameEn: 'T5 Bypass · Blind Uphill', spd: 92, thr: 66, brk: 0, glat: 0.94, glong: 0.25, type: 't5' },
        { range: [0.74, 1.00], nameEs: 'T9 Crest · Rasante', nameEn: 'T9 Crest · Drop-off', spd: 74, thr: 12, brk: 56, glat: -1.12, glong: -0.62, type: 't9' },
      ];

      const callouts = {
        t1: {
          feedEs: '📍 T1 Entry (150m): Frena en línea recta antes de girar; prepara trail-braking.',
          feedEn: '📍 T1 Entry (150m): Brake straight before turn-in; set up trail-braking.',
          hot: {
            superaj: es ? '¡Suelta el freno progresivamente al girar — no lo sueltes de golpe!' : 'Release the brake slowly as you turn — do not let go all at once!',
            aj: 'Trail off. Release.',
            rachel: 'Trail off the brake — front is loaded, ease the G-vector.',
            tony: 'Breathe off the brake — feel the car rotate!',
            garmin: '84% brake — Trail braking. G-Long: -1.05g. Release linearly.'
          }
        },
        t2: {
          coldPhysEs: 'Gemini 3.8 Flash: En T2 Carousel mantén 20% de acelerador de mantenimiento. Física: soltar de golpe transfiere peso adelante y provoca sobreviraje (Regla #2).',
          coldPhysEn: 'Gemini 3.8 Flash: Hold 20% maintenance throttle in T2 Carousel. Physics: lifting abruptly shifts weight forward -> Lift-Off Oversteer (Rule #2).',
          coldGenericEs: 'Gemini (sin física): Vas rápido en la curva 2, intenta manejar con más cuidado.',
          coldGenericEn: 'Gemini (no physics): You are going fast in Turn 2, try driving more carefully.'
        },
        t5: {
          hot: {
            superaj: es ? '¡Confía en la compresión de la subida — comprométete con el acelerador!' : 'Trust the uphill compression — commit to throttle!',
            aj: 'Commit. Go.',
            rachel: 'Compression increases vertical tire load — build progressive throttle.',
            tony: 'Commit! Trust the grip — send it up the hill!',
            garmin: 'G-Lat 0.94g — 34% traction headroom available. Commit.'
          }
        },
        t9: {
          feedEs: '📍 T9 Crest (Lookahead 8s): Perdiste 16 mph aquí la vuelta pasada — frena ANTES de la cresta.',
          feedEn: '📍 T9 Crest (8s Lookahead): Lost 16 mph here last lap — brake BEFORE the crest.',
          rainAlertEs: '⚠️ LLUVIA (0.6g): Límite del círculo de fricción superado en T9 — ¡Reduce freno 25% ya!',
          rainAlertEn: '⚠️ RAIN (0.6g): Friction circle exceeded at T9 — Ease brake 25% now!'
        }
      };

      const feedEl = document.getElementById('feed');
      const coachBtns = document.querySelectorAll('[data-coach]');
      const rainBtn = document.getElementById('btn-rain');
      const physBtn = document.getElementById('btn-phys');
      const pauseBtn = document.getElementById('btn-pause');
      const gripTag = document.getElementById('grip-tag');
      const fcOuter = document.getElementById('fc-outer');
      const activePersonaEl = document.getElementById('active-persona');
      const pathStatusEl = document.getElementById('path-status');
      const carDot = document.getElementById('car-dot');
      const carRing = document.getElementById('car-ring');
      const valSpeed = document.getElementById('val-speed');
      const unitSpeed = document.getElementById('unit-speed');
      const barThr = document.getElementById('bar-thr');
      const valThr = document.getElementById('val-thr');
      const barBrk = document.getElementById('bar-brk');
      const valBrk = document.getElementById('val-brk');
      const valGlat = document.getElementById('val-glat');
      const valGlong = document.getElementById('val-glong');
      const valUsage = document.getElementById('val-usage');
      const sectorName = document.getElementById('sector-name');
      const fcDot = document.getElementById('fc-dot');

      function resolveSectorPhase(progress) {
        const idx = phases.findIndex(p => progress >= p.range[0] && progress < p.range[1]);
        return idx >= 0 ? idx : 0;
      }

      function pushMsg(kind, badge, text) {
        const div = document.createElement('div');
        div.className = 'msg ' + kind;
        const head = document.createElement('div');
        head.className = 'msg-head';
        const badgeEl = document.createElement('span');
        badgeEl.textContent = badge;
        const timeEl = document.createElement('span');
        timeEl.textContent = new Date().toLocaleTimeString([], { hour12: false, minute: '2-digit', second: '2-digit' });
        head.append(badgeEl, timeEl);
        const bodyEl = document.createElement('div');
        bodyEl.textContent = text;
        div.append(head, bodyEl);
        feedEl.prepend(div);
        while (feedEl.children.length > 4) feedEl.lastElementChild.remove();
      }

      function emitForPhase(idx) {
        const p = phases[idx];
        const wet = cockpit.surface === 'wet';
        const guarded = cockpit.guardrails === 'enabled';
        if (p.type === 't1') {
          pushMsg('feedforward', 'FEEDFORWARD · <150m', es ? callouts.t1.feedEs : callouts.t1.feedEn);
          pushMsg('hot', 'HOT PATH · <50ms', callouts.t1.hot[cockpit.persona]);
        } else if (p.type === 't2') {
          const txt = guarded
            ? (es ? callouts.t2.coldPhysEs : callouts.t2.coldPhysEn)
            : (es ? callouts.t2.coldGenericEs : callouts.t2.coldGenericEn);
          pushMsg('cold', 'COLD PATH · GEMINI 3.8 FLASH', txt);
        } else if (p.type === 't5') {
          pushMsg('hot', 'HOT PATH · <50ms', callouts.t5.hot[cockpit.persona]);
        } else if (p.type === 't9') {
          pushMsg('feedforward', 'PREDICTIVE · 8s', es ? callouts.t9.feedEs : callouts.t9.feedEn);
          if (wet) pushMsg('hot', 'HOT SAFETY · <50ms', es ? callouts.t9.rainAlertEs : callouts.t9.rainAlertEn);
        }
      }

      function renderTelemetry() {
        const t = cockpit.progress;
        const wet = cockpit.surface === 'wet';
        const p = phases[cockpit.sectorPhase];
        const pt = pathEl.getPointAtLength(t * totalLen);
        carDot.setAttribute('cx', pt.x.toFixed(1));
        carDot.setAttribute('cy', pt.y.toFixed(1));
        carRing.setAttribute('cx', pt.x.toFixed(1));
        carRing.setAttribute('cy', pt.y.toFixed(1));

        const gripScale = wet ? 0.62 : 1.0;
        const spd = Math.round(p.spd * (wet ? 0.84 : 1) + Math.sin(t * 40) * 2);
        const thr = Math.max(0, Math.min(100, Math.round(p.thr * (wet ? 0.85 : 1))));
        const brk = Math.max(0, Math.min(100, Math.round(p.brk)));
        const glat = p.glat * (wet ? 0.78 : 1);
        const glong = p.glong * (wet ? 0.82 : 1);
        const totalG = Math.hypot(glat, glong);
        const usage = Math.min(135, Math.round((totalG / (1.45 * gripScale)) * 100));

        valSpeed.textContent = String(spd);
        unitSpeed.textContent = `${spd} MPH · ${Math.round(spd * 1.609)} km/h`;
        barThr.style.setProperty('--level', (thr / 100).toFixed(2));
        valThr.textContent = thr + '%';
        barBrk.style.setProperty('--level', (brk / 100).toFixed(2));
        valBrk.textContent = brk + '%';
        valGlat.textContent = (glat >= 0 ? '+' : '') + glat.toFixed(2) + 'g';
        valGlong.textContent = (glong >= 0 ? '+' : '') + glong.toFixed(2) + 'g';
        valUsage.textContent = usage + '%';
        sectorName.textContent = '📍 ' + (es ? p.nameEs : p.nameEn);

        fcDot.setAttribute('cx', (glat * 28).toFixed(1));
        fcDot.setAttribute('cy', (-glong * 28).toFixed(1));
        fcDot.setAttribute('fill', usage > 98 ? '#ea4335' : usage > 75 ? '#fbbc04' : '#4ade80');
      }

      function syncSimLoop() {
        const shouldRun = cockpit.playback === 'playing' && !document.hidden;
        if (shouldRun && !simTimer) {
          simTimer = setInterval(() => send({ type: 'TICK', delta: 0.008 }), 100);
        } else if (!shouldRun && simTimer) {
          clearInterval(simTimer);
          simTimer = null;
        }
      }

      function syncDom() {
        const isPaused = cockpit.playback === 'paused';
        const isWet = cockpit.surface === 'wet';
        const isGuarded = cockpit.guardrails === 'enabled';

        document.body.dataset.playbackState = cockpit.playback;
        document.body.dataset.surfaceState = cockpit.surface;
        document.body.dataset.guardrailState = cockpit.guardrails;
        document.body.dataset.persona = cockpit.persona;
        document.body.dataset.sectorPhase = String(cockpit.sectorPhase);

        coachBtns.forEach(b => {
          const active = b.dataset.coach === cockpit.persona;
          b.classList.toggle('active', active);
          b.setAttribute('aria-pressed', String(active));
          if (active) activePersonaEl.textContent = b.textContent.trim().toUpperCase();
        });

        rainBtn.classList.toggle('on', isWet);
        rainBtn.textContent = isWet ? (es ? '🌧️ Lluvia (0.6g)' : '🌧️ Rain (0.6g)') : (es ? '☀️ Seco (1.0g)' : '☀️ Dry (1.0g)');
        gripTag.textContent = isWet ? 'GRIP 60%' : 'GRIP 100%';
        fcOuter.setAttribute('r', isWet ? '30' : '46');

        physBtn.classList.toggle('off', !isGuarded);
        physBtn.textContent = isGuarded ? (es ? '🧠 Física: ON' : '🧠 Physics: ON') : (es ? '⚠️ Física: OFF' : '⚠️ Physics: OFF');
        pathStatusEl.textContent = isGuarded
          ? 'HOT <50ms · COLD Gemini 3.8'
          : (es ? 'HOT <50ms · ⚠️ SIN FÍSICA' : 'HOT <50ms · ⚠️ NO PHYSICS');

        const pauseLabel = isPaused
          ? (es ? 'Reanudar simulación' : 'Resume simulation')
          : (es ? 'Pausar simulación' : 'Pause simulation');
        pauseBtn.textContent = isPaused ? '▶' : '⏸';
        pauseBtn.setAttribute('aria-label', pauseLabel);
        pauseBtn.title = pauseLabel;

        syncSimLoop();
        renderTelemetry();
      }

      function getState() {
        return {
          playback: cockpit.playback,
          surface: cockpit.surface,
          guardrails: cockpit.guardrails,
          persona: cockpit.persona,
          sectorPhase: cockpit.sectorPhase,
          sectorId: phases[cockpit.sectorPhase].type,
          progress: Number(cockpit.progress.toFixed(4)),
          hidden: document.hidden,
          reducedMotion: reduceMotion.matches,
          allowedEvents: [
            'TOGGLE_PLAYBACK',
            cockpit.playback === 'playing' ? 'PAUSE' : 'PLAY',
            'TOGGLE_SURFACE',
            cockpit.surface === 'dry' ? 'SET_WET' : 'SET_DRY',
            'TOGGLE_GUARDRAILS',
            cockpit.guardrails === 'enabled' ? 'DISABLE_GUARDRAILS' : 'ENABLE_GUARDRAILS',
            'SET_PERSONA',
            'STEP',
            'SEEK',
          ],
        };
      }

      function getTransitions() {
        return COCKPIT_TRANSITIONS;
      }

      function send(input, extra = {}) {
        const evt = typeof input === 'string' ? { type: input, ...extra } : (input || {});
        const type = evt.type;
        let phaseChanged = false;

        if (type === 'TOGGLE_PLAYBACK' || type === 'PLAY' || type === 'PAUSE') {
          const next = COCKPIT_TRANSITIONS.playback[cockpit.playback][type];
          userPlaybackIntent = next === 'paused' ? 'pause' : 'play';
          cockpit = { ...cockpit, playback: next };
        } else if (type === 'MOTION_REDUCE' || type === 'MOTION_ALLOW') {
          if (type === 'MOTION_REDUCE') userPlaybackIntent = 'auto';
          if (userPlaybackIntent !== 'pause') {
            cockpit = { ...cockpit, playback: COCKPIT_TRANSITIONS.playback[cockpit.playback][type] };
          }
        } else if (type === 'TOGGLE_SURFACE' || type === 'SET_WET' || type === 'SET_DRY' || type === 'SET_SURFACE') {
          const mapped = type === 'SET_SURFACE' ? (evt.surface === 'wet' ? 'SET_WET' : evt.surface === 'dry' ? 'SET_DRY' : null) : type;
          if (mapped) cockpit = { ...cockpit, surface: COCKPIT_TRANSITIONS.surface[cockpit.surface][mapped] };
        } else if (type === 'TOGGLE_GUARDRAILS' || type === 'ENABLE_GUARDRAILS' || type === 'DISABLE_GUARDRAILS' || type === 'SET_GUARDRAILS') {
          const mapped = type === 'SET_GUARDRAILS'
            ? (evt.guardrails === 'disabled' ? 'DISABLE_GUARDRAILS' : evt.guardrails === 'enabled' ? 'ENABLE_GUARDRAILS' : null)
            : type;
          if (mapped) {
            const nextGuard = COCKPIT_TRANSITIONS.guardrails[cockpit.guardrails][mapped];
            if (nextGuard !== cockpit.guardrails) {
              cockpit = { ...cockpit, guardrails: nextGuard };
              emitForPhase(2);
            }
          }
        } else if (type === 'SET_PERSONA') {
          if (COCKPIT_TRANSITIONS.personas.includes(evt.persona)) {
            cockpit = { ...cockpit, persona: evt.persona };
            pushMsg('hot', 'HOT PATH · <50ms', callouts.t1.hot[cockpit.persona]);
          }
        } else if (type === 'TICK' || type === 'STEP') {
          const delta = Number.isFinite(evt.delta) ? evt.delta : 0.008;
          const nextProgress = ((cockpit.progress + delta) % 1 + 1) % 1;
          const nextSector = resolveSectorPhase(nextProgress);
          phaseChanged = nextSector !== cockpit.sectorPhase;
          cockpit = { ...cockpit, progress: nextProgress, sectorPhase: nextSector };
          if (phaseChanged) emitForPhase(nextSector);
          if (type === 'TICK') {
            document.body.dataset.sectorPhase = String(cockpit.sectorPhase);
            renderTelemetry();
            return getState();
          }
        } else if (type === 'SEEK') {
          let nextProgress = cockpit.progress;
          if (Number.isInteger(evt.sectorPhase) && evt.sectorPhase >= 0 && evt.sectorPhase < phases.length) {
            nextProgress = phases[evt.sectorPhase].range[0];
          } else if (Number.isFinite(evt.progress)) {
            nextProgress = ((evt.progress % 1) + 1) % 1;
          }
          const nextSector = resolveSectorPhase(nextProgress);
          phaseChanged = nextSector !== cockpit.sectorPhase;
          cockpit = { ...cockpit, progress: nextProgress, sectorPhase: nextSector };
          if (phaseChanged) emitForPhase(nextSector);
        }

        syncDom();
        return getState();
      }

      coachBtns.forEach(btn => {
        btn.addEventListener('click', () => send({ type: 'SET_PERSONA', persona: btn.dataset.coach }));
      });
      rainBtn.addEventListener('click', () => send('TOGGLE_SURFACE'));
      physBtn.addEventListener('click', () => send('TOGGLE_GUARDRAILS'));
      pauseBtn.addEventListener('click', () => send('TOGGLE_PLAYBACK'));
      reduceMotion.addEventListener('change', e => send(e.matches ? 'MOTION_REDUCE' : 'MOTION_ALLOW'));
      document.addEventListener('visibilitychange', syncSimLoop);

      emitForPhase(1);
      emitForPhase(2);
      syncDom();
      window.cockpitSim = { getState, send, getTransitions };
    })();
  </script>
</body>
</html>
