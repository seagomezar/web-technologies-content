<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentador | IA Confiable a 100 MPH</title>
  <link rel="stylesheet" href="../i18n.css">
  <script defer src="i18n.js?v=1"></script>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="theme.css?v=1">
  <link rel="stylesheet" href="../slides/presenter.css?v=1">
  <script defer src="workshop-es.js?v=1"></script>
  <script defer src="workshop-en.js?v=1"></script>
  <script defer src="workshop.js?v=1"></script>
  <script defer src="presenter.js?v=1"></script>
</head>
<body>
  <header>
    <div>
      <strong id="pres-title">Construyendo IA Confiable a 100 MPH · Workshop</strong>
      <div class="connection" id="connection" role="status" aria-live="polite">Conectando con la presentación…</div>
    </div>
    <div class="clock">
      <span id="wall-clock"></span>
      <strong id="elapsed">00:00</strong>
      <span id="remaining">Plan 90:00</span>
    </div>
  </header>
  <main>
    <section class="current">
      <h2 id="position">Diapositiva actual</h2>
      <div class="preview" inert><iframe id="current-preview" title="Diapositiva actual" tabindex="-1"></iframe></div>
      <div class="actions">
        <button type="button" id="previous">← Anterior</button>
        <button type="button" id="next">Siguiente →</button>
        <button type="button" id="clock">Iniciar reloj</button>
        <button type="button" id="reset">Reiniciar reloj</button>
      </div>
      <p id="plan"></p>
      <h2 id="script-heading">Guion del facilitador y pasos</h2>
      <ol id="script"></ol>
    </section>
    <aside>
      <h2 id="next-heading">Siguiente diapositiva</h2>
      <div class="preview" inert><iframe id="next-preview" title="Siguiente diapositiva" tabindex="-1"></iframe></div>
      <h3 id="next-title"></h3>
      <p id="next-note"></p>
      <details open>
        <summary id="schedule-summary">Agenda por diapositiva (90 min)</summary>
        <ol id="schedule"></ol>
      </details>
      <details>
        <summary id="sources-summary">Enlaces y fuentes del workshop</summary>
        <ul id="sources"></ul>
      </details>
    </aside>
  </main>
</body>
</html>
